# ---------------- App Name ----------------
# This name is used by Spring for logging and identification
spring.application.name=ElectronicStore


# ---------------- Database Config ----------------
# JDBC URL of your MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/electronic_store

# DB username
spring.datasource.username=root

# DB password
spring.datasource.password=12345

# MySQL JDBC driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ---------------- Hibernate / JPA Config ----------------
# Automatically create / update tables based on your Entities
# update = modifies schema without deleting data
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries in console (good for debugging)
spring.jpa.show.sql=true

# Tell Hibernate you are using MySQL database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#file config
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ---------------- File Upload Config ----------------
# Base folder where user profile images will be stored
# This folder will be created inside your project root if not present
user.profile.image.path=images/users/
category.image.path=images/categories/
product.image.path=images/products/
# For Windows, use a path like this:
#project.image=C:/uploads/electronic-store/
#user.profile.image.path=C:/uploads/electronic-store/images/users/


